name: twicome

# 軽量構成: db(MySQL, 省メモリ設定) / migrate(起動時のみ) / app / batch の 4 サービス。
# Redis・FAISS・形態素解析は廃止した。

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-db-env: &db-env
  DATABASE_URL: "${COMPOSE_DATABASE_URL:-mysql+pymysql://appuser:apppass@db:3306/appdb?charset=utf8mb4}"
  MYSQL_HOST: "${COMPOSE_MYSQL_HOST:-db}"
  MYSQL_PORT: "${COMPOSE_MYSQL_PORT:-3306}"
  MYSQL_USER: "${COMPOSE_MYSQL_USER:-appuser}"
  MYSQL_PASSWORD: "${COMPOSE_MYSQL_PASSWORD:-apppass}"
  MYSQL_DATABASE: "${COMPOSE_MYSQL_DATABASE:-appdb}"

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${COMPOSE_MYSQL_ROOT_PASSWORD:-rootpass}"
      MYSQL_DATABASE: "${COMPOSE_MYSQL_DATABASE:-appdb}"
      MYSQL_USER: "${COMPOSE_MYSQL_USER:-appuser}"
      MYSQL_PASSWORD: "${COMPOSE_MYSQL_PASSWORD:-apppass}"
    # 収集対象ユーザーのコメントだけを保存するのでデータは小さい。メモリとディスクを絞る。
    command:
      - --innodb-buffer-pool-size=64M
      - --innodb-log-buffer-size=8M
      - --innodb-redo-log-capacity=64M
      - --performance-schema=OFF
      - --disable-log-bin
      - --max-connections=30
      - --table-open-cache=256
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --temptable-max-ram=64M
      - --thread-cache-size=4
      - --skip-name-resolve
    # DB はホストへ公開せず、同一 Compose ネットワーク内から参照する
    expose:
      - "3306"
    volumes:
      - mysql8_honban_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - backend

  migrate:
    build:
      context: ./migrate
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "${COMPOSE_DATABASE_URL:-mysql+pymysql://appuser:apppass@db:3306/appdb?charset=utf8mb4}"
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging
    networks:
      - backend

  app:
    build:
      context: ./app
      target: runtime
    # ホストにはポートを開けない。リバースプロキシから http://twicome:8000 で届く
    env_file:
      - ./.env
    environment:
      <<: *db-env
      DEFAULT_PLATFORM: twitch
      # ROOT_PATH: /
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
    volumes:
      - ./data/honban:/host # 主にtargetusers.csvのため
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--no-access-log"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging
    networks:
      backend:
      proxy:
        aliases:
          - twicome
    dns:
      - 1.1.1.1
      - 8.8.8.8

  batch:
    build:
      context: .
      dockerfile: batch/Dockerfile
    env_file:
      - ./.env
    environment:
      <<: *db-env
      PROJECT_ROOT: /app
      APP_ENV: honban
    volumes:
      - ./data/honban:/app/data/honban
      # チャットファイル（<vod_id>.json.gz と判定台帳）の保存先。別ディスクに置く場合は .env で指定する
      - ${COMMENTS_HOST_DIR:-./data/honban/comments}:/app/data/honban/comments
      - ./.env:/app/.env:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging
    networks:
      - backend
    dns:
      - 1.1.1.1
      - 8.8.8.8

volumes:
  mysql8_honban_data:

networks:
  backend:
    driver: bridge
  # リバースプロキシと共有する外部ネットワーク（名前は .env の PROXY_NETWORK で指定）
  proxy:
    external: true
    name: "${PROXY_NETWORK:-proxy_net}"
